services:
  productflow-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: productflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: productflow
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - productflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productflow -d productflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  productflow-redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - productflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 可选回退：`docker compose --profile python up`。默认不要与 Go 同时占用 29280。
  productflow-backend:
    profiles: ["python"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 29280
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:29281,http://127.0.0.1:29281}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?set ADMIN_ACCESS_KEY in .env}
      SETTINGS_ACCESS_TOKEN: ${SETTINGS_ACCESS_TOKEN:?set SETTINGS_ACCESS_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://productflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@productflow-postgres:5432/productflow
      REDIS_URL: redis://productflow-redis:6379/0
      STORAGE_ROOT: /app/storage
      AGENT_SERVICE_BASE_URL: http://productflow-agent-service:29284
      AGENT_SERVICE_INTERNAL_TOKEN: ${AGENT_SERVICE_INTERNAL_TOKEN:?set AGENT_SERVICE_INTERNAL_TOKEN in .env}
      AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS:-5}
      AGENT_SERVICE_READ_TIMEOUT_SECONDS: ${AGENT_SERVICE_READ_TIMEOUT_SECONDS:-90}
      AGENT_TURN_SYNC_POLL_SECONDS: ${AGENT_TURN_SYNC_POLL_SECONDS:-1}
      LOG_DIR: /app/storage/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:-10485760}
      UPLOAD_MAX_REFERENCE_IMAGES: ${UPLOAD_MAX_REFERENCE_IMAGES:-6}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-16000000}
      UPLOAD_ALLOWED_IMAGE_MIME_TYPES: ${UPLOAD_ALLOWED_IMAGE_MIME_TYPES:-image/png,image/jpeg,image/webp}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_DELAY_MS: ${JOB_RETRY_DELAY_MS:-10000}
      GENERATION_MAX_CONCURRENT_TASKS: ${GENERATION_MAX_CONCURRENT_TASKS:-3}
    command: >-
      sh -c "alembic upgrade head && uvicorn productflow_backend.main:app --host 0.0.0.0 --port 29280"
    ports:
      - "${PYTHON_APP_HOST_PORT:-29286}:29280"
    volumes:
      # STORAGE_HOST_PATH is host-only. Leave it unset to use the productflow-storage named volume,
      # or set it to an existing absolute host directory.
      - ${STORAGE_HOST_PATH:-productflow-storage}:/app/storage
    depends_on:
      productflow-postgres:
        condition: service_healthy
      productflow-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:29280/healthz', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  productflow-worker:
    profiles: ["python"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?set ADMIN_ACCESS_KEY in .env}
      SETTINGS_ACCESS_TOKEN: ${SETTINGS_ACCESS_TOKEN:?set SETTINGS_ACCESS_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://productflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@productflow-postgres:5432/productflow
      REDIS_URL: redis://productflow-redis:6379/0
      STORAGE_ROOT: /app/storage
      AGENT_SERVICE_BASE_URL: http://productflow-agent-service:29284
      AGENT_SERVICE_INTERNAL_TOKEN: ${AGENT_SERVICE_INTERNAL_TOKEN:?set AGENT_SERVICE_INTERNAL_TOKEN in .env}
      AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS:-5}
      AGENT_SERVICE_READ_TIMEOUT_SECONDS: ${AGENT_SERVICE_READ_TIMEOUT_SECONDS:-90}
      AGENT_TURN_SYNC_POLL_SECONDS: ${AGENT_TURN_SYNC_POLL_SECONDS:-1}
      LOG_DIR: /app/storage/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:-10485760}
      UPLOAD_MAX_REFERENCE_IMAGES: ${UPLOAD_MAX_REFERENCE_IMAGES:-6}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-16000000}
      UPLOAD_ALLOWED_IMAGE_MIME_TYPES: ${UPLOAD_ALLOWED_IMAGE_MIME_TYPES:-image/png,image/jpeg,image/webp}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_DELAY_MS: ${JOB_RETRY_DELAY_MS:-10000}
      GENERATION_MAX_CONCURRENT_TASKS: ${GENERATION_MAX_CONCURRENT_TASKS:-3}
    command: ["dramatiq", "--processes", "2", "--threads", "4", "productflow_backend.workers"]
    volumes:
      # Keep this source identical to productflow-backend so API and worker see the same files at /app/storage.
      - ${STORAGE_HOST_PATH:-productflow-storage}:/app/storage
    depends_on:
      productflow-backend:
        condition: service_healthy
      productflow-agent-service:
        condition: service_healthy

  productflow-async-dispatcher:
    profiles: ["python"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?set ADMIN_ACCESS_KEY in .env}
      SETTINGS_ACCESS_TOKEN: ${SETTINGS_ACCESS_TOKEN:?set SETTINGS_ACCESS_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://productflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@productflow-postgres:5432/productflow
      REDIS_URL: redis://productflow-redis:6379/0
      STORAGE_ROOT: /app/storage
      AGENT_SERVICE_BASE_URL: http://productflow-agent-service:29284
      AGENT_SERVICE_INTERNAL_TOKEN: ${AGENT_SERVICE_INTERNAL_TOKEN:?set AGENT_SERVICE_INTERNAL_TOKEN in .env}
      AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS:-5}
      AGENT_SERVICE_READ_TIMEOUT_SECONDS: ${AGENT_SERVICE_READ_TIMEOUT_SECONDS:-90}
      AGENT_TURN_SYNC_POLL_SECONDS: ${AGENT_TURN_SYNC_POLL_SECONDS:-1}
      LOG_DIR: /app/storage/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:-10485760}
      UPLOAD_MAX_REFERENCE_IMAGES: ${UPLOAD_MAX_REFERENCE_IMAGES:-6}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-16000000}
      UPLOAD_ALLOWED_IMAGE_MIME_TYPES: ${UPLOAD_ALLOWED_IMAGE_MIME_TYPES:-image/png,image/jpeg,image/webp}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_DELAY_MS: ${JOB_RETRY_DELAY_MS:-10000}
      GENERATION_MAX_CONCURRENT_TASKS: ${GENERATION_MAX_CONCURRENT_TASKS:-3}
    command: >-
      sh -c "while true; do python -m productflow_backend.commands.run_async_dispatcher --limit 100; sleep 1; done"
    volumes:
      - ${STORAGE_HOST_PATH:-productflow-storage}:/app/storage
    depends_on:
      productflow-backend:
        condition: service_healthy
      productflow-agent-service:
        condition: service_healthy

  # Alembic 仍是 schema 权威。Go API 不跑迁移。
  productflow-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://productflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@productflow-postgres:5432/productflow
    command: ["alembic", "upgrade", "head"]
    depends_on:
      productflow-postgres:
        condition: service_healthy
    restart: "no"

  # 默认业务运行时：Go API / worker / dispatcher。Python 三进程改走 profile python。
  productflow-go-api:
    build:
      context: .
      dockerfile: go/Dockerfile
    restart: unless-stopped
    environment: &productflow-go-env
      APP_HOST: 0.0.0.0
      APP_PORT: 29280
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?set ADMIN_ACCESS_KEY in .env}
      SETTINGS_ACCESS_TOKEN: ${SETTINGS_ACCESS_TOKEN:?set SETTINGS_ACCESS_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://productflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@productflow-postgres:5432/productflow
      REDIS_URL: redis://productflow-redis:6379/0
      STORAGE_ROOT: /app/storage
      AGENT_SERVICE_BASE_URL: http://productflow-agent-service:29284
      AGENT_SERVICE_INTERNAL_TOKEN: ${AGENT_SERVICE_INTERNAL_TOKEN:?set AGENT_SERVICE_INTERNAL_TOKEN in .env}
      AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS:-5}
      AGENT_SERVICE_READ_TIMEOUT_SECONDS: ${AGENT_SERVICE_READ_TIMEOUT_SECONDS:-90}
      AGENT_TURN_SYNC_POLL_SECONDS: ${AGENT_TURN_SYNC_POLL_SECONDS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:-10485760}
      UPLOAD_MAX_REFERENCE_IMAGES: ${UPLOAD_MAX_REFERENCE_IMAGES:-6}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-16000000}
      UPLOAD_ALLOWED_IMAGE_MIME_TYPES: ${UPLOAD_ALLOWED_IMAGE_MIME_TYPES:-image/png,image/jpeg,image/webp}
    command: ["productflow-api"]
    ports:
      - "${APP_HOST_PORT:-29280}:29280"
    volumes:
      - ${STORAGE_HOST_PATH:-productflow-storage}:/app/storage
    depends_on:
      productflow-postgres:
        condition: service_healthy
      productflow-redis:
        condition: service_healthy
      productflow-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:29280/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  productflow-go-worker:
    build:
      context: .
      dockerfile: go/Dockerfile
    restart: unless-stopped
    environment: *productflow-go-env
    command: ["productflow-worker"]
    volumes:
      - ${STORAGE_HOST_PATH:-productflow-storage}:/app/storage
    depends_on:
      productflow-postgres:
        condition: service_healthy
      productflow-redis:
        condition: service_healthy
      productflow-migrate:
        condition: service_completed_successfully
      productflow-go-api:
        condition: service_healthy
      productflow-agent-service:
        condition: service_healthy

  productflow-go-dispatcher:
    build:
      context: .
      dockerfile: go/Dockerfile
    restart: unless-stopped
    environment: *productflow-go-env
    command: ["productflow-dispatcher", "--watch"]
    volumes:
      - ${STORAGE_HOST_PATH:-productflow-storage}:/app/storage
    depends_on:
      productflow-postgres:
        condition: service_healthy
      productflow-redis:
        condition: service_healthy
      productflow-migrate:
        condition: service_completed_successfully

  productflow-agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_LISTEN_ADDRESS: 0.0.0.0:29284
      AGENT_DATA_ROOT: /data
      PRODUCTFLOW_INTERNAL_BASE_URL: http://productflow-go-api:29280
      PRODUCTFLOW_REQUEST_TIMEOUT: ${PRODUCTFLOW_REQUEST_TIMEOUT:-30s}
      AGENT_SERVICE_INTERNAL_TOKEN: ${AGENT_SERVICE_INTERNAL_TOKEN:?set AGENT_SERVICE_INTERNAL_TOKEN in .env}
      AGENT_EVENT_POLL_INTERVAL: ${AGENT_EVENT_POLL_INTERVAL:-100ms}
      AGENT_HEARTBEAT_INTERVAL: ${AGENT_HEARTBEAT_INTERVAL:-15s}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-40}
      AGENT_MODEL_CONTEXT_WINDOW: ${AGENT_MODEL_CONTEXT_WINDOW:-128000}
      AGENT_AUTO_COMPACT_TOKEN_LIMIT: ${AGENT_AUTO_COMPACT_TOKEN_LIMIT:-96000}
      AGENT_MAX_CONCURRENT_TURNS: ${AGENT_MAX_CONCURRENT_TURNS:-3}
    volumes:
      - productflow-agent-data:/data
    depends_on:
      productflow-go-api:
        condition: service_healthy

  productflow-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-29281}:80"
    depends_on:
      productflow-go-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  productflow-postgres-data:
  productflow-redis-data:
  productflow-storage:
  productflow-agent-data:
